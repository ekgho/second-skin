<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Submit Incident</title>

<link rel="stylesheet" href="styles.css">

</head>
<body>

<header>
<h1>Incident Submission</h1>
</header>

<form id="incidentForm">

<label>
Incident Type
</label>

<select id="incidentType">

<option>Privacy Concern</option>

<option>Harassment</option>

<option>Cyberstalking</option>

<option>Data Exposure</option>

<option>Other</option>

</select>

<label>
Description
</label>

<textarea
id="description"
rows="10"
required
></textarea>

<label>
Contact Email (Optional)
</label>

<input
type="email"
id="email"
/>

<button type="submit">

Generate Case Number

</button>

</form>

<div id="result"></div>

<script src="script.js"></script>

</body>
</html>
